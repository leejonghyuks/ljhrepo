<html>
    <head>
        <title>TTS</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
    </head>
    <style>
            .editor-container {
                margin: 20px;
                padding: 20px;
                border: 1px solid #ccc;
                border-radius: 5px;
            }
    </style>
</html>
<div class="editor-container">
    <button type="button" id="btn-mic">🎙️ 음성 입력 시작</button>
    <span id="mic-status" style="color: gray;">대기 중</span>
    <br><br>
    <textarea id="board-content" rows="10" cols="60" placeholder="내용을 입력하세요..."></textarea>
  </div>
  <script>
    const micBtn = document.getElementById('btn-mic');
    const statusSpan = document.getElementById('mic-status');
    const contentArea = document.getElementById('board-content');
  
    // 브라우저 호환성 체크
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  
    if (!SpeechRecognition) {
      alert('현재 브라우저는 음성 인식을 지원하지 않습니다. (Chrome/Edge 권장)');
    } else {
      const recognition = new SpeechRecognition();
  
      // 설정
      recognition.lang = 'ko-KR';        // 인식 언어 (한국어)
      recognition.continuous = true;     // 계속 음성 인식 유치
      recognition.interimResults = true;  // 실시간 중간 결과 반영
  
      let isListening = false;
  
      // 마이크 버튼 클릭 토글
      micBtn.addEventListener('click', () => {
        if (!isListening) {
          recognition.start();
        } else {
          recognition.stop();
        }
      });
  
      // 인식 시작 시
      recognition.onstart = () => {
        isListening = true;
        micBtn.textContent = '⏹️ 음성 입력 중단';
        statusSpan.textContent = '음성을 듣고 있습니다...';
        statusSpan.style.color = 'red';
      };
  
      // 음성 인식 결과 수신 시
      recognition.onresult = (event) => {
        let finalTranscript = '';
        let interimTranscript = '';
  
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscript += transcript + ' ';
          } else {
            interimTranscript += transcript;
          }
        }
  
        // 기존 텍스트에 인식된 음성 텍스트 추가 (또는 커서 위치에 추가)
        if (finalTranscript) {
          contentArea.value += finalTranscript;
        }
      };
  
      // 오류 발생 시
      recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
        statusSpan.textContent = `오류 발생: ${event.error}`;
      };
  
      // 인식 종료 시
      recognition.onend = () => {
        isListening = false;
        micBtn.textContent = '🎙️ 음성 입력 시작';
        statusSpan.textContent = '대기 중';
        statusSpan.style.color = 'gray';
      };
    }
  </script>
