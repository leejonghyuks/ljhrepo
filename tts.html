<!DOCTYPE html>
<html lang="ko">
<head>
    <title>TTS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <style>
        .editor-container {
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <button type="button" id="btn-mic">🎙️ 음성 입력 시작</button>
        <span id="mic-status" style="color: gray;">대기 중</span>
        <br><br>
        <textarea id="board-content" rows="10" cols="60" placeholder="내용을 입력하세요..."></textarea>
    </div>

    <script>
        const micBtn = document.getElementById('btn-mic');
        const statusSpan = document.getElementById('mic-status');
        const contentArea = document.getElementById('board-content');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert('현재 브라우저는 음성 인식을 지원하지 않습니다. (Chrome/Edge 권장)');
        } else {
            const recognition = new SpeechRecognition();

            recognition.lang = 'ko-KR';
            recognition.continuous = true;
            recognition.interimResults = true;

            let isListening = false;
            let baseText = ''; // 음성 입력 시작 시점의 기존 텍스트 (단일 보존)

            micBtn.onclick = () => {
                if (!isListening) {
                    isListening = true;
                    contentArea.blur(); // 한글 조합(IME) 간섭 제거

                    // [핵심 1] 시작 버튼을 누른 딱 그 순간의 텍스트만 보존합니다.
                    baseText = contentArea.value;
                    if (baseText && !baseText.endsWith(' ') && !baseText.endsWith('\n')) {
                        baseText += ' ';
                    }

                    try {
                        recognition.start();
                    } catch (e) {
                        console.error('이미 실행 중입니다:', e);
                    }
                } else {
                    isListening = false;
                    recognition.stop();
                }
            };

            recognition.onstart = () => {
                micBtn.textContent = '⏹️ 음성 입력 중단';
                statusSpan.textContent = '음성을 듣고 있습니다...';
                statusSpan.style.color = 'red';
            };

            recognition.onresult = (event) => {
                let sessionFinal = '';
                let interimTranscript = '';

                // [핵심 2] 현재 세션(0번부터 끝까지) 전체 결과를 매번 새로 읽습니다.
                for (let i = 0; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        sessionFinal += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }

                // [핵심 3] baseText 변수를 절대로 여기서 수정(+=)하지 않고 대입만 합니다.
                // 결과: [시작 시점 텍스트] + [이번 세션 확정 문장] + [실시간 입력 중 문장]
                contentArea.value = baseText + sessionFinal + interimTranscript;
            };

            recognition.onerror = (event) => {
                if (event.error !== 'no-speech') {
                    console.error('Speech recognition error:', event.error);
                    statusSpan.textContent = `오류 발생: ${event.error}`;
                }
            };

            recognition.onend = () => {
                if (isListening) {
                    // 무음으로 인해 브라우저가 자동 재연결할 때만 baseText 업데이트
                    baseText = contentArea.value;
                    if (baseText && !baseText.endsWith(' ') && !baseText.endsWith('\n')) {
                        baseText += ' ';
                    }
                    
                    try {
                        recognition.start();
                    } catch (e) {}
                } else {
                    micBtn.textContent = '🎙️ 음성 입력 시작';
                    statusSpan.textContent = '대기 중';
                    statusSpan.style.color = 'gray';
                }
            };
        }
    </script>
</body>
</html>
