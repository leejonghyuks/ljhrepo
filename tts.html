<!DOCTYPE html>
<html lang="ko">
<head>
    <title>TTS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <style>
        .editor-container {
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <button type="button" id="btn-mic">음성 입력 시작!!</button>
        <span id="mic-status" style="color: gray;">대기 중</span>
        <br><br>
        <textarea id="board-content" rows="10" cols="60" placeholder="내용을 입력하세요..."></textarea>
    </div>

    <script>
        const micBtn = document.getElementById('btn-mic');
        const statusSpan = document.getElementById('mic-status');
        const contentArea = document.getElementById('board-content');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert('현재 브라우저는 음성 인식을 지원하지 않습니다. (Chrome/Edge 권장)');
        } else {
            const recognition = new SpeechRecognition();

            // [해결책 1] continuous를 false로 설정하여 크롬 중복 버그 차단
            recognition.lang = 'ko-KR';
            recognition.continuous = false; 
            recognition.interimResults = true;

            let isListening = false; // 사용자가 의도한 작동 상태
            let baseText = '';       // 시작 시점의 기존 텍스트

            // [해결책 2] addEventListener 대신 onclick으로 리스너 중복 등록 방지
            micBtn.onclick = () => {
                if (!isListening) {
                    isListening = true;
                    
                    // [해결책 3] 입력 중이던 한글 조합(IME)을 강제 종료하여 중복 합성 방지
                    contentArea.blur(); 

                    baseText = contentArea.value;
                    if (baseText && !baseText.endsWith(' ') && !baseText.endsWith('\n')) {
                        baseText += ' ';
                    }
                    
                    try {
                        recognition.start();
                    } catch (e) {
                        console.error('이미 실행 중입니다:', e);
                    }
                } else {
                    isListening = false;
                    recognition.stop();
                }
            };

            recognition.onstart = () => {
                micBtn.textContent = '⏹️ 음성 입력 중단';
                statusSpan.textContent = '음성을 듣고 있습니다...';
                statusSpan.style.color = 'red';
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = 0; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }

                // 확정된 텍스트가 생기면 baseText에 누적
                if (finalTranscript) {
                    baseText += finalTranscript + ' ';
                }

                // 화면 출력 update
                contentArea.value = baseText + interimTranscript;
            };

            recognition.onerror = (event) => {
                // 단순 무음(no-speech)은 사용자가 끌 때까지 무시
                if (event.error !== 'no-speech') {
                    console.error('Speech recognition error:', event.error);
                    statusSpan.textContent = `오류 발생: ${event.error}`;
                }
            };

            // [해결책 4] continuous: false 상태에서 인식 세션이 끝날 때, 
            // 사용자가 중단 버튼을 누른 게 아니라면 자동으로 다음 세션 재시작
           /*
            recognition.onend = () => {
                if (isListening) {
                    try {
                        recognition.start();
                    } catch (e) {
                        // 연속 재시작 예외 처리
                    }
                } else {
                    micBtn.textContent = '🎙️ 음성 입력 시작';
                    statusSpan.textContent = '대기 중';
                    statusSpan.style.color = 'gray';
                }
            };
            */
        }
    </script>
</body>
</html>
